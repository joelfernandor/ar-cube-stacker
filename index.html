<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Virtual Surface AR Cube Stacker</title>
  <link rel="stylesheet" href="style.css">

  <!-- CDNs for Graphics, Physics, and MediaPipe Vision -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Front Selfie Camera Video Viewport -->
  <video id="webcam" playsinline webkit-playsinline muted></video>

  <!-- 3D Three.js Render Overlay -->
  <div id="canvas-container"></div>

  <!-- Dual Hand Cursors -->
  <div id="hand-cursor-0" class="hand-cursor hidden"></div>
  <div id="hand-cursor-1" class="hand-cursor hidden"></div>

  <!-- HUD Control Layer -->
  <div id="hud-container">
    <div id="metrics-bar" class="hidden">
      <div class="badge">CUBES: <span id="cube-count">0</span></div>
      <div class="badge">HEIGHT: <span id="tower-height">0.00 m</span></div>
    </div>

    <div id="instruction-banner">
      Hold out BOTH hands to span your virtual table surface
    </div>

    <div id="action-controls">
      <button id="btn-set-area" class="btn btn-green">LOCK VIRTUAL TABLE</button>
      <button id="btn-drop-cube" class="btn btn-cyan hidden">DROP CUBE</button>
      <button id="btn-reset" class="btn btn-red hidden">RESET SPACE</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
